<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}授权服务器{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/admin/licenses">授权服务器</a>
    {% if admin %}
    <nav>
      <a href="/admin/licenses">授权列表</a>
      <a href="/admin/logs">日志</a>
      <a class="button" href="/admin/licenses/new">新增卡密</a>
      <form action="/admin/logout" method="post" class="inline"><button type="submit">退出</button></form>
    </nav>
    {% endif %}
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
